name: Test gameplay response schema

on:
  push:
    branches:
      - feature/adult-scene-gameplay-v2

jobs:
  schema-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pydantic==2.11.7
      - run: python -m compileall -q app
      - name: Validate optional gameplay fields
        run: |
          python - <<'PY'
          from app.schemas import ActionItem
          item = ActionItem(
              actionId='a1', label='verified segment', startTime=1.0, endTime=4.0,
              sourceVerified=True, confidence=.9, subjectTrackId='TRACK_01',
              adultScene=True, adultSceneId='adult-1', positionId='missionary',
              positionOccurrenceId='occ-1', outcomeType='climax',
              outcomeStartTime=3.0, outcomeEndTime=4.0, outcomeUnlockProgress=82,
          )
          assert item.positionOccurrenceId == 'occ-1'
          assert item.outcomeType == 'climax'
          PY
